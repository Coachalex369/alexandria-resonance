<!doctype html>
<!-- Geometry Laboratory (The Forge): standalone experimental page. Side panel of dense controls + big canvas.
     Logic lives in lab.js (DOM wiring) and src/labModel.js (pure state). No dependencies, no network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Geometry Laboratory</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<main id="stage"><canvas id="cv" aria-label="Geometry canvas"></canvas><div id="hint">drag: orbit | wheel: dolly | click a node: ripple</div></main>
<aside id="panel">
  <h1>Geometry Laboratory</h1>

  <section>
    <h2>Structure</h2>
    <select id="structure"></select>
    <div class="row"><button id="subdivide">Subdivide</button><button id="connect">Connect nearest</button><button id="reset">Reset</button></div>
    <div id="stats" class="mono">-</div>
    <div id="warn" class="warn" hidden></div>
  </section>

  <section>
    <h2>Rotation</h2>
    <label class="chk"><input type="checkbox" id="auto3d"> auto-rotate</label>
    <label>speed <input type="range" id="speed" min="0" max="4" step="0.05" value="1"><span id="speedV" class="mono"></span></label>
    <label>xy <input type="range" id="a-xy" min="0" max="6.2832" step="0.01" value="0"><span id="v-xy" class="mono"></span></label>
    <label>xz <input type="range" id="a-xz" min="0" max="6.2832" step="0.01" value="0"><span id="v-xz" class="mono"></span></label>
    <label>yz <input type="range" id="a-yz" min="0" max="6.2832" step="0.01" value="0"><span id="v-yz" class="mono"></span></label>
    <div id="rot4">
      <label class="chk"><input type="checkbox" id="auto4d"> auto 4D (xw, zw)</label>
      <label>xw <input type="range" id="a-xw" min="0" max="6.2832" step="0.01" value="0"><span id="v-xw" class="mono"></span></label>
      <label>yw <input type="range" id="a-yw" min="0" max="6.2832" step="0.01" value="0"><span id="v-yw" class="mono"></span></label>
      <label>zw <input type="range" id="a-zw" min="0" max="6.2832" step="0.01" value="0"><span id="v-zw" class="mono"></span></label>
    </div>
  </section>

  <section>
    <h2>Projection and camera</h2>
    <div id="proj4">
      <label>4D to 3D <select id="proj4mode"><option value="perspective">perspective</option><option value="orthographic">orthographic</option></select></label>
      <label>viewer dist <input type="range" id="proj4dist" min="1.5" max="8" step="0.05" value="3.5"><span id="proj4distV" class="mono"></span></label>
    </div>
    <label>camera <select id="cammode"><option value="perspective">perspective</option><option value="orthographic">orthographic</option></select></label>
    <label>fov <input type="range" id="fov" min="0.3" max="2" step="0.01" value="0.9"><span id="fovV" class="mono"></span></label>
    <label>distance <input type="range" id="camdist" min="1.5" max="20" step="0.05" value="4"><span id="camdistV" class="mono"></span></label>
    <label class="chk"><input type="checkbox" id="autoorbit"> camera auto-orbit</label>
  </section>

  <section>
    <h2>Effects</h2>
    <label class="chk"><input type="checkbox" id="faces"> faces</label>
    <label>face alpha <input type="range" id="facealpha" min="0" max="0.5" step="0.005" value="0.08"></label>
    <label class="chk"><input type="checkbox" id="glow" checked> glow</label>
    <label class="chk"><input type="checkbox" id="nodes" checked> node dots</label>
    <label>colour <select id="colormode"><option value="w">by w depth</option><option value="part">by structure part</option><option value="single">single hue</option></select></label>
    <label>hue <input type="range" id="hue" min="0" max="360" step="1" value="200"></label>
  </section>

  <section>
    <h2>Ripples</h2>
    <div class="row"><button id="random">Random ripple</button><button id="clear">Clear ripples</button></div>
    <div id="ripples" class="mono">waves 0 | rings 0</div>
  </section>

  <section>
    <h2>Run</h2>
    <div class="row"><button id="pause">Pause</button><button id="snapshot">Snapshot PNG</button></div>
    <label class="chk"><input type="checkbox" id="reduced"> Reduced motion</label>
    <div id="readout" class="mono">-</div>
    <div id="rmflag" class="mono">reduced motion: off</div>
  </section>
</aside>
<script type="module" src="lab.js"></script>
</body>
</html>
